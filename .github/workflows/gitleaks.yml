# SPDX-License-Identifier: GPL-3.0-only
name: Gitleaks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$TMP_DIR" gitleaks
          sudo install -m 0755 "$TMP_DIR/gitleaks" /usr/local/bin/gitleaks
      - name: Run Gitleaks
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            gitleaks git --no-banner --redact --exit-code 1 --log-opts="origin/${{ github.base_ref }}..HEAD" .
          else
            gitleaks git --no-banner --redact --exit-code 1 .
          fi

  security-gate:
    name: security-gate
    runs-on: ubuntu-latest
    needs: [gitleaks]
    if: always()
    steps:
      - name: Evaluate Security Gate
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: |
          [[ "$GITLEAKS_RESULT" == "success" ]]
